[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
# Optimizer: keeps DeSciDAO well below the 24,576-byte contract size limit (EIP-170)
optimizer = true
optimizer_runs = 200
# Ignore compiler warnings from third-party libraries (e.g. OpenZeppelin Checkpoints.sol)
ignored_warnings_from = ["lib"]

[lint]
# Governance periods are measured in days, so block.timestamp drift is not a concern
exclude_lints = ["block-timestamp"]


